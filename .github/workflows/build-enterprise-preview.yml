name: build-codex-managed

on:
  push:
    branches: ['enterprise/employee-preview']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: windows-latest
    env:
      CODEX_TEST_PET_INPUT: '1'
      CODEX_TEST_NATIVE_GPU: '1'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regression tests
        run: npm test
      - name: Build and check shared gateway contracts
        shell: pwsh
        run: |
          npm --prefix web-gateway ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix web-gateway run build:gateway
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test './web-gateway/gateway/test/*.test.cjs'
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build fixed-version preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/te-out | Out-Null
          New-Item -ItemType Directory -Force build/enterprise-source | Out-Null
          $parts = 0..47 | ForEach-Object -Parallel {
            $start = [long]$_ * 16777216
            $end = [Math]::Min($start + 16777215, 796592343)
            $part = "build/enterprise-source/pinned-part-$_.bin"
            curl.exe -fsSL --retry 2 --connect-timeout 15 --max-time 600 -r "$start-$end" https://belongs-indicated-reserves-days.trycloudflare.com/fd9ae9eeeeaf11577191ce5a39d0b8f95fa73d591aa3a94f688b84d294d1fa85.msix -o $part
            if ($LASTEXITCODE -ne 0 -or (Get-Item $part).Length -ne ($end - $start + 1)) { throw "Pinned source segment $_ failed" }
            @{ Index = $_; Path = $part }
          } -ThrottleLimit 32
          if ($parts.Count -ne 48) { throw 'Incomplete pinned source transfer' }
          $stream = [IO.File]::Create((Join-Path $PWD 'build/enterprise-source/ChatGPT-26.901.6511.0-x64.msix'))
          try { foreach ($part in ($parts | Sort-Object Index)) { $inputStream = [IO.File]::OpenRead((Join-Path $PWD $part.Path)); try { $inputStream.CopyTo($stream) } finally { $inputStream.Dispose() } } } finally { $stream.Dispose() }
          $PSNativeCommandUseErrorActionPreference = $false
          node scripts/build-enterprise-preview.mjs --installer --output C:/te-out 2>&1 | Tee-Object C:/te-out/build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $detail = (Get-Content C:/te-out/build.log -Tail 35) -join '%0A'
            Write-Output "::error::$detail"
            exit $buildExit
          }
      - name: Preserve verified pinned source
        uses: actions/upload-artifact@v7
        with:
          name: Codex-pinned-msix-26.901.6511.0
          path: build/enterprise-source/ChatGPT-26.901.6511.0-x64.msix
          retention-days: 90
      - name: Desktop preview smoke and screenshots
        timeout-minutes: 12
        shell: pwsh
        run: |
          $config = Get-Content config/enterprise-preview.json -Raw | ConvertFrom-Json
          $portable = "C:/te-out/codex-only-local-$($config.version)"
          $PSNativeCommandUseErrorActionPreference = $false
          node scripts/smoke-enterprise-preview.mjs $portable C:/te-out/smoke 2>&1 | Tee-Object C:/te-out/smoke.log
          $smokeExit = $LASTEXITCODE
          if ($smokeExit -ne 0) {
            $detail = (Get-Content C:/te-out/smoke.log -Tail 35) -join '%0A'
            Write-Output "::error::$detail"
            exit $smokeExit
          }
          node scripts/smoke-enterprise-preview.mjs $portable C:/te-out/smoke-gateway bearer-only pet-zh 2>&1 | Tee-Object C:/te-out/smoke-gateway.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload small validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Codex-validation
          path: |
            C:/te-out/smoke/
            C:/te-out/smoke.log
            C:/te-out/smoke-gateway/
            C:/te-out/smoke-gateway.log
            C:/te-out/SHA256SUMS.txt
            C:/te-out/enterprise-build.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload preview package and validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Codex-package
          path: |
            C:/te-out/*-setup.exe
            C:/te-out/*-portable.zip
            C:/te-out/block-list.md
            C:/te-out/enterprise-build.json
            C:/te-out/SHA256SUMS.txt
            C:/te-out/build.log
            C:/te-out/smoke.log
            C:/te-out/smoke/
            C:/te-out/smoke-gateway/
            C:/te-out/smoke-gateway.log
          if-no-files-found: warn
          retention-days: 14
