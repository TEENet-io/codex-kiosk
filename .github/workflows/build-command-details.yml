name: build-command-details
on:
  push:
    branches: ['build/command-details']
    paths-ignore:
      - 'docs/**'
      - 'CHANGELOG.md'
      - '.github/workflows/publish-verified-b7.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: command-details-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CODEX_TEST_PET_INPUT: '1'
      CODEX_TEST_NATIVE_GPU: '1'
      CODEX_TEST_EXEC_DETAILS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Gateway checks
        shell: pwsh
        run: |
          npm --prefix web-gateway ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix web-gateway run build:gateway
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test './web-gateway/gateway/test/*.test.cjs'
      - name: Fetch immutable b6 package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:/codex-cache,C:/te-out | Out-Null
          curl.exe -fL --retry 3 https://github.com/TEENet-io/codex-kiosk/releases/download/offline-v26.901.51231-b6/codex-only-local-26.901.51231-b6-portable.zip -o C:/codex-cache/b6.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify candidate installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          node scripts/enterprise/build-exec-details-candidate.mjs C:/codex-cache/b6.zip C:/te-out
      - name: Install and verify desktop interactions
        shell: pwsh
        run: |
          node scripts/smoke-enterprise-preview.mjs C:/te-out/codex-only-local-26.901.51231-b7 C:/te-out/smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-enterprise-preview.mjs C:/te-out/codex-only-local-26.901.51231-b7 C:/te-out/smoke-gateway bearer-only pet-zh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Codex-validation
          path: |
            C:/te-out/smoke/
            C:/te-out/smoke-gateway/
            C:/te-out/SHA256SUMS.txt
            C:/te-out/enterprise-build.json
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Codex-package
          path: |
            C:/te-out/*-setup.exe
            C:/te-out/*-portable.zip
            C:/te-out/SHA256SUMS.txt
            C:/te-out/enterprise-build.json
          retention-days: 14
