name: diagnose-enterprise-startup
on:
  push:
    branches: ['diagnostic/gateway-startup']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  startup:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        auth: [control, apikey, bearer-only, stale-chatgpt]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: TEENet-Codex-enterprise-preview
          run-id: 34328652505
          github-token: ${{ github.token }}
          path: C:/te-diagnostic
      - name: Unpack unchanged preview.2
        shell: pwsh
        run: |
          $zip = Get-ChildItem C:/te-diagnostic -Filter '*-portable.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Preview portable ZIP not found' }
          Expand-Archive $zip.FullName C:/te-portable
      - name: Reproduce employee catalog startup
        shell: pwsh
        run: |
          $metadata = Get-ChildItem C:/te-portable -Recurse -Filter enterprise-build.json | Select-Object -First 1
          if (-not $metadata) { throw 'Preview metadata not found' }
          $installer = Get-ChildItem C:/te-diagnostic -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          Copy-Item $installer.FullName ($metadata.DirectoryName + '-setup.exe')
          node scripts/smoke-enterprise-preview.mjs $metadata.DirectoryName C:/te-report '${{ matrix.auth }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gateway-startup-${{ matrix.auth }}
          path: C:/te-report
          retention-days: 7
