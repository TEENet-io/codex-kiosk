name: build-offline-package-monitor

# Raises an issue when the build fails and closes it when a later build passes.
#
# It used to re-run a failed build automatically, up to three attempts. That was
# aimed at the flaky part -- the store resolver gets rate-limited -- but it is
# the wrong instrument for it. The resolver fails in the first two minutes,
# while a retry re-runs the whole job: another 40 minutes and another 745 MB
# MSIX. And the failures actually seen are patch drift against a new upstream
# Codex, which is perfectly deterministic: three attempts produce three
# identical failures, delay the signal by over an hour, and leave several
# attempts to chase when cancelling. Failing once, visibly, is the point.
#
# A genuinely transient failure is now re-run by hand from the Actions tab.

on:
  workflow_run:
    workflows:
      - build-offline-package
    types:
      - completed

permissions:
  issues: write
  contents: read

jobs:
  alert-on-failure:
    if: ${{ github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          BRANCH_NAME: ${{ github.event.workflow_run.head_branch }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          EVENT_NAME: ${{ github.event.workflow_run.event }}
        run: |
          # The title doubles as the search key that close-alert-after-success
          # uses to find this issue, so it has to stay exactly as it is even
          # though there are no longer any retries to fail after. Changing it
          # would orphan any issue already open.
          title="[CI Alert] build-offline-package failed after retries"
          body=$(cat <<EOF
          The build failed. It is not retried automatically: the failures this
          repo actually sees are patch drift against a new upstream Codex, which
          repeats identically. Re-run from the Actions tab if the cause looks
          transient, otherwise adapt the patches (docs/版本适配与维护.md).

          - Name: ${WORKFLOW_NAME}
          - Run ID: ${RUN_ID}
          - Attempts: ${RUN_ATTEMPT}
          - Branch: ${BRANCH_NAME}
          - Commit: ${COMMIT_SHA}
          - Event: ${EVENT_NAME}
          - Run URL: ${RUN_URL}
          EOF
          )

          issue_number=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search 'build-offline-package failed after retries in:title' \
            --json number \
            --jq '.[0].number')

          if [ -n "$issue_number" ] && [ "$issue_number" != "null" ]; then
            gh issue comment "$issue_number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

  close-alert-after-success:
    if: ${{ github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Close open failure alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          issue_number=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search 'build-offline-package failed after retries in:title' \
            --json number \
            --jq '.[0].number')

          if [ -n "$issue_number" ] && [ "$issue_number" != "null" ]; then
            gh issue comment "$issue_number" --repo "$REPO" --body "A later workflow run succeeded: ${RUN_URL}"
            gh issue close "$issue_number" --repo "$REPO"
          fi

