name: build-offline-package

on:
  workflow_dispatch:
    inputs:
      build_installer:
        description: Build the Inno Setup installer
        required: false
        default: true
        type: boolean
      force_rebuild:
        description: Rebuild and republish even when the same release tag already exists
        required: false
        default: false
        type: boolean
  # A full run downloads a ~700 MB MSIX, repacks the asar and compresses the
  # installer, so it is far too heavy to fire on every push to main. Builds are
  # started by hand from the Actions tab (or `gh workflow run`); the nightly
  # schedule stays on as the drift probe - it self-skips while the Store version
  # is unchanged and already released, and only builds when a new Codex ships,
  # which is exactly when the patches need checking.
  schedule:
    - cron: '15 3 * * *'

permissions:
  contents: write

concurrency:
  group: codex-offline-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate patch scripts
        shell: pwsh
        run: |
          function Test-PowerShellSyntax {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Path
            )

            $resolvedPath = (Resolve-Path $Path).Path
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $resolvedPath,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              foreach ($error in $errors) {
                Write-Error "${Path}:$($error.Extent.StartLineNumber): $($error.Message)"
              }
              throw "PowerShell syntax validation failed for $Path."
            }
          }

          node --check './scripts/patch-app-asar.mjs'
          node --check './scripts/offline-direct-launch-smoke.mjs'
          node --check './scripts/extract-webview-from-asar.mjs'
          node --check './scripts/build-api-model-catalog.mjs'
          node --check './web-gateway/start-web.mjs'
          node --test './scripts/test/*.test.cjs'
          Test-PowerShellSyntax './scripts/build-offline-package.ps1'
          Test-PowerShellSyntax './scripts/verify-offline-package.ps1'

      - name: Install resolver dependencies
        run: npm ci

      - name: Install Playwright browser
        # The store-bundle resolver (resolve-store-bundle-url.mjs) drives a
        # headless Chromium via Playwright to read the MSIX download URL from
        # rg-adguard when the direct API returns no rows (GitHub runner IPs are
        # frequently rate-limited by rg-adguard). npm ci installs the package
        # but not the browser binary. This MUST run before "Resolve source
        # version", which always executes and may hit the browser fallback.
        run: npx playwright install chromium chromium-headless-shell

      - name: Resolve source version
        id: source
        shell: pwsh
        run: |
          $metadata = & ./scripts/get-app-source-version.ps1 -ConfigPath 'config/codex-only-local.json' | ConvertFrom-Json
          "release_marker=$($metadata.releaseMarker)" >> $env:GITHUB_OUTPUT
          "version=$($metadata.version)" >> $env:GITHUB_OUTPUT
          "package_id=$($metadata.packageId)" >> $env:GITHUB_OUTPUT
          "source_mode=$($metadata.sourceMode)" >> $env:GITHUB_OUTPUT
          if ($null -ne $metadata.packageFamilyName) {
            "package_family_name=$($metadata.packageFamilyName)" >> $env:GITHUB_OUTPUT
          }

      - name: Skip build when version already released
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          # Which releases were already built from this upstream MSIX. The tag
          # cannot answer that any more: releases are named after the version
          # the application displays, which is only readable after the MSIX has
          # been downloaded and unpacked. Every release name carries the MSIX
          # version as a marker, so matching on that answers it from a listing.
          $repo = '${{ github.repository }}'
          $marker = '${{ steps.source.outputs.release_marker }}'
          # tagName and name only: `gh release list --json` does not offer url
          # (that is a `gh release view` field), and asking for it fails the
          # step outright. The URL is derivable from the tag anyway.
          $listed = gh release list --repo $repo --limit 200 --json tagName,name
          if ($LASTEXITCODE -ne 0) {
            # Guessing here would be worse than stopping: an empty list reads as
            # "never built", which republishes build 1 over an existing release
            # and hands the fleet a version string it has already seen.
            throw "gh release list failed with exit code $LASTEXITCODE; cannot determine the build number."
          }
          $existing = @($listed | ConvertFrom-Json | Where-Object { $_.name -like "*($marker)*" })

          # Each rebuild of the same upstream gets the next number, so a
          # re-patched package is a distinct version rather than an invisible
          # overwrite -- the fleet compares versions for equality and would
          # otherwise skip installing the fix.
          $buildNumber = $existing.Count + 1
          "build_number=$buildNumber" >> $env:GITHUB_OUTPUT

          if ($env:WORKFLOW_EVENT_NAME -eq 'pull_request') {
            "force_rebuild=false" >> $env:GITHUB_OUTPUT
            "skip_build=false" >> $env:GITHUB_OUTPUT
            "skip_publish=true" >> $env:GITHUB_OUTPUT
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Pull request build: verification build will run, but publish steps are disabled."
            exit 0
          }

          $tag = if ($existing.Count -gt 0) { $existing[0].tagName } else { '' }
          "existing_release_tag=$tag" >> $env:GITHUB_OUTPUT
          $existingReleaseUrl = if ($tag) { "https://github.com/$repo/releases/tag/$tag" } else { '' }
          $forceRebuild = $false

          if ($env:WORKFLOW_EVENT_NAME -eq 'workflow_dispatch' -and $env:WORKFLOW_FORCE_REBUILD -eq 'true') {
            $forceRebuild = $true
          }

          "force_rebuild=$($forceRebuild.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($existing.Count -gt 0) {
            "existing_release_url=$existingReleaseUrl" >> $env:GITHUB_OUTPUT
            if ($forceRebuild) {
              "skip_build=false" >> $env:GITHUB_OUTPUT
              "skip_publish=false" >> $env:GITHUB_OUTPUT
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "$marker was already built as $tag ($existingReleaseUrl), but force rebuild is enabled. This run publishes build $buildNumber as a NEW release; the existing one is left alone."
            }
            elseif ($env:WORKFLOW_EVENT_NAME -eq 'workflow_dispatch') {
              # A hand-started run is someone wanting to test a change, so build
              # it and leave the artifact to download - just do not publish
              # unless force_rebuild says so. Without this a manual run would
              # silently skip everything once the version has been released,
              # and report success having built nothing.
              "skip_build=false" >> $env:GITHUB_OUTPUT
              "skip_publish=true" >> $env:GITHUB_OUTPUT
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "$marker was already built as $tag ($existingReleaseUrl). A verification build will still run, but publish steps will be skipped. Re-run with force_rebuild to publish it as build $buildNumber."
            }
            else {
              "skip_build=true" >> $env:GITHUB_OUTPUT
              "skip_publish=true" >> $env:GITHUB_OUTPUT
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "$marker was already built as $tag ($existingReleaseUrl). Build and publish steps were skipped."
            }
          }
          else {
            "skip_build=false" >> $env:GITHUB_OUTPUT
            "skip_publish=false" >> $env:GITHUB_OUTPUT
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "$marker has not been built before. Build and publish steps will continue as build $buildNumber."
          }

          $global:LASTEXITCODE = 0
          exit 0

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          $applied = (Get-ItemPropertyValue -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled") -eq 1
          if (-not $applied) { throw "Failed to enable Windows long path support." }
          git config --system core.longpaths true
          Write-Host "Windows long path support enabled."

      - name: Ensure Inno Setup
        if: ${{ steps.release_check.outputs.skip_build != 'true' && (github.event_name != 'workflow_dispatch' || inputs.build_installer) }}
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Download existing build metadata
        if: ${{ steps.release_check.outputs.skip_build == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cacheDir = '.release-cache'
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          try {
            gh release download '${{ steps.release_check.outputs.existing_release_tag }}' --repo '${{ github.repository }}' --pattern 'build-metadata.json' --dir $cacheDir --clobber
          } catch {
            Write-Warning "Could not download existing build metadata: $_"
          }

      - name: Build offline bundle
        if: ${{ steps.release_check.outputs.skip_build != 'true' }}
        shell: pwsh
        run: |
          $arguments = @(
            '-NoProfile',
            '-File',
            './scripts/build-offline-package.ps1',
            '-ConfigPath',
            'config/codex-only-local.json',
            '-MetadataOutputPath',
            'build-metadata.json',
            '-BuildNumber',
            '${{ steps.release_check.outputs.build_number }}',
            '-WorkRoot',
            # Use a short absolute path so Inno Setup can compress files with deeply-nested
            # node_modules paths. The staging path under the GitHub Actions workspace root
            # (D:\a\<repo>\<repo>\build\work\stage\...) reaches 260+ characters, which exceeds
            # the Windows MAX_PATH limit that Inno Setup's file I/O uses.
            'D:\cb'
          )

          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.build_installer }}' -eq 'false') {
            $arguments += '-SkipInstaller'
          }

          $process = Start-Process -FilePath 'pwsh' -ArgumentList $arguments -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "build-offline-package.ps1 failed with exit code $($process.ExitCode)."
          }

      - name: Read build metadata
        if: ${{ steps.release_check.outputs.skip_build != 'true' }}
        id: build
        shell: pwsh
        run: |
          $metadata = Get-Content 'build-metadata.json' -Raw | ConvertFrom-Json
          "release_tag=$($metadata.releaseTag)" >> $env:GITHUB_OUTPUT
          "release_name=$($metadata.releaseName)" >> $env:GITHUB_OUTPUT
          "artifact_dir=$($metadata.artifactDirectoryRelative)" >> $env:GITHUB_OUTPUT
          "version=$($metadata.version)" >> $env:GITHUB_OUTPUT
          "app_version=$($metadata.appVersion)" >> $env:GITHUB_OUTPUT
          "source_version=$($metadata.sourceVersion)" >> $env:GITHUB_OUTPUT
          "package_id=$($metadata.packageId)" >> $env:GITHUB_OUTPUT
          "generated_at=$($metadata.generatedAt)" >> $env:GITHUB_OUTPUT
          "source_mode=$($metadata.appSource.mode)" >> $env:GITHUB_OUTPUT

      - name: Verify offline bundle
        if: ${{ steps.release_check.outputs.skip_build != 'true' }}
        shell: pwsh
        run: |
          $arguments = @(
            '-NoProfile',
            '-File',
            './scripts/verify-offline-package.ps1',
            '-BuildMetadataPath',
            'build-metadata.json',
            '-ConfigPath',
            'config/codex-only-local.json'
          )

          if ('${{ github.event_name }}' -ne 'workflow_dispatch' -or '${{ inputs.build_installer }}' -ne 'false') {
            $arguments += '-RequireInstallerAsset'
          }

          $process = Start-Process -FilePath 'pwsh' -ArgumentList $arguments -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "verify-offline-package.ps1 failed with exit code $($process.ExitCode)."
          }

      - name: Build release notes
        shell: pwsh
        run: |
          $skipBuild = '${{ steps.release_check.outputs.skip_build }}' -eq 'true'
          $packageId = '${{ steps.source.outputs.package_id }}'
          $version = ''
          $appVersion = ''
          $sourceVersion = '${{ steps.source.outputs.version }}'
          $sourceMode = '${{ steps.source.outputs.source_mode }}'
          $generatedAt = ''
          $changelog = $null

          if (-not $skipBuild) {
            $packageId = '${{ steps.build.outputs.package_id }}'
            $version = '${{ steps.build.outputs.version }}'
            $appVersion = '${{ steps.build.outputs.app_version }}'
            $sourceVersion = '${{ steps.build.outputs.source_version }}'
            $sourceMode = '${{ steps.build.outputs.source_mode }}'
            $generatedAt = '${{ steps.build.outputs.generated_at }}'
          }
          elseif (Test-Path '.release-cache/build-metadata.json') {
            $existingMetadata = Get-Content '.release-cache/build-metadata.json' -Raw | ConvertFrom-Json
            $packageId = $existingMetadata.packageId
            $version = $existingMetadata.version
            $appVersion = $existingMetadata.appVersion
            $sourceVersion = $existingMetadata.sourceVersion
            $sourceMode = $existingMetadata.appSource.mode
            $generatedAt = $existingMetadata.generatedAt
          }

          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("Source package: `` $packageId ``")
          # Three numbers, because there genuinely are three. The package
          # version is what to publish to the fleet; the app version is what
          # the About panel shows on the machine; the MSIX version identifies
          # the store package this was repackaged from and appears nowhere on
          # an installed machine.
          if ($version) {
            $lines.Add("Package version: `` $version ``")
          }
          if ($appVersion) {
            $lines.Add("App-reported version: `` $appVersion ``")
          }
          $lines.Add("MSIX version: `` $sourceVersion ``")
          $lines.Add("Source mode: `` $sourceMode ``")
          if ($generatedAt) {
            $lines.Add("Built at: `` $generatedAt ``")
          }

          if ($version) {
            try {
              $changelogJson = node ./scripts/get-store-app-changelog.mjs --version $version --recent-app-limit 5
              $changelog = $changelogJson | ConvertFrom-Json
              if ($changelog.releaseNotesMarkdown) {
                $lines.Add("")
                $lines.Add("## Official Codex app release notes")
                $lines.Add("")
                $lines.Add($changelog.releaseNotesMarkdown)
              }
            } catch {
              Write-Warning "Could not fetch app changelog: $_"
            }
          }

          if ($changelog -and $changelog.recentAppReleases -and $changelog.recentAppReleases.Count -gt 0) {
            $lines.Add("")
            $lines.Add("## Official Codex app history")
            $lines.Add("")
            foreach ($release in $changelog.recentAppReleases) {
              $publishedAt = if ($release.publishedAt) { $release.publishedAt } else { 'unknown date' }
              $title = if ([string]::IsNullOrWhiteSpace($release.title)) { 'Codex app release' } else { $release.title }
              $sourceUrl = if ([string]::IsNullOrWhiteSpace($release.sourceUrl)) { 'https://developers.openai.com/codex/changelog?type=codex-app' } else { $release.sourceUrl }
              $lines.Add("- [$title]($sourceUrl) - $publishedAt")
            }
          }

          $lines.Add("")
          $lines.Add("## Assets")
          $lines.Add("")
          $lines.Add("- portable zip")
          $lines.Add("- setup exe")
          $lines.Add("- bundled skills zip")
          $lines.Add("- ``models-api.json`` (optional API/custom-provider catalog; see https://github.com/${{ github.repository }}/blob/main/docs/models-api.md)")
          $lines.Add("- SHA256SUMS.txt")

          ($lines -join "`n") | Set-Content -Path 'release-notes.md' -Encoding UTF8 -NoNewline

      - name: Upload workflow artifacts
        if: ${{ steps.release_check.outputs.skip_build != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.release_tag }}
          path: ${{ steps.build.outputs.artifact_dir }}
          if-no-files-found: error

      - name: Publish release assets
        if: ${{ github.event_name != 'pull_request' && steps.release_check.outputs.skip_publish != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.build.outputs.release_tag }}
          name: ${{ steps.build.outputs.release_name }}
          files: ${{ steps.build.outputs.artifact_dir }}/*
          overwrite_files: true
          body_path: release-notes.md

      - name: Update existing release notes
        if: ${{ steps.release_check.outputs.skip_build == 'true' && steps.release_check.outputs.skip_publish == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit '${{ steps.release_check.outputs.existing_release_tag }}' --repo '${{ github.repository }}' --notes-file 'release-notes.md'
